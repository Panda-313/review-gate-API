[project]
name = "review-gate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=0.3.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langsmith>=0.10.16",
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
    "sentence-transformers>=5.7.0",
]

[project.scripts]
ingest-knowledge = "src.scripts.ingest:main"
api = "api.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
